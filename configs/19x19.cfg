# 19x19 preset: the full board. The code supports it end to end, but a CPU
# can afford only a short demonstration run; expect slow, modest progress.
#
# This file is a preset, not a fixed contract: any key can be overridden on
# the command line with --set key=value (e.g. --set simulations=100). The
# values are tuned from pilot measurements on an Apple M4 (see
# docs/results/bench.txt and docs/results/pilots/).

# run: reproducibility seed, how long to train, threads (0 = all cores), math backend
seed = 1
# generations: 20 kept. 1-generation pilot 2026-09-29 (10 threads, blas,
# docs/results/pilots/19x19.csv): 62 min per generation (self-play 49.5 min
# for 20 games of 151 plies, train 7.9 min, arena 5.0 min with 1 opponent).
# Expect 1-1.5 h per generation as games lengthen, so ~1 day for 20.
generations = 20
workers = 0
# backend naive -> blas: bench 2026-09-29, 19x19 evals/s 13 -> 229 and
# train step 10.6 -> 2.4 s. Needs a -DAZ_USE_BLAS=ON build; without one,
# pass --set backend=naive (about 17x slower).
backend = blas

# game: board, komi (Tromp-Taylor area scoring), move cap (0 = 2 * n * n)
board_size = 19
komi = 7.5
max_moves = 0

# network (architecture keys; cannot change when resuming a run)
history = 8
blocks = 10
filters = 128
value_hidden = 256

# self-play and search: games per generation, MCTS budget, root noise, opening temperature
games_per_generation = 20
simulations = 400
mcts_batch = 8
c_puct = 1.5
dirichlet_scale = 10
noise_fraction = 0.25
temperature_moves = 30

# training: replay window, SGD steps per generation, learning rate by generation
buffer_positions = 500000
# train_steps 100 -> 80: the pilot's replay ratio was 8.49 (100 x 256 samples
# over 20 x 151 new positions), above the 2-8 band. 80 gives 6.8 at 151 plies
# and 2.6 if games grow to 400 plies.
train_steps = 80
batch_size = 256
lr_schedule = 0:0.02
momentum = 0.9
weight_decay = 0.0001

# arena: how often, how many games per opponent (even), ladder size, search budget, gating
arena_every = 1
arena_games = 10
arena_opponents = 2
arena_simulations = 100
arena_temperature_moves = 4
gating = false
gating_threshold = 0.55

# output: self-play games saved as SGF per generation
sgf_per_generation = 2
