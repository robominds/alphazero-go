# 9x9 preset: the main target. Big enough for real Go shape (life and death,
# ko fights), small enough to train on a CPU over a day or two.
#
# This file is a preset, not a fixed contract: any key can be overridden on
# the command line with --set key=value (e.g. --set simulations=100). The
# values are tuned from pilot measurements on an Apple M4 (see
# docs/results/bench.txt and docs/results/pilots/).

# run: reproducibility seed, how long to train, threads (0 = all cores), math backend
seed = 1
# generations 100 -> 150: 2-generation pilot 2026-09-29 (10 threads, blas,
# docs/results/pilots/9x9.csv) measured 2.6 min per generation (self-play
# 78-86 s at 74-80 plies, train 61 s, arena 8-14 s with 1-2 opponents). With
# 4 arena opponents and games growing towards 100-160 plies that becomes
# ~3-4.5 min, well under the 12 min budget, so no search or network cuts are
# needed and 150 generations fill a ~10 h night (7.5-11 h). (Measured
# before the recipe below, which adds about 1 min of training per
# generation: 200 more steps at ~150 ms; its self-play costs about the same.
# From scratch with the recipe: 5.6 min per generation, 150 generations in
# 13.9 h on a 16 GB M4, docs/results/9x9-scratch/log.csv.)
generations = 150
workers = 0
# backend naive -> blas: bench 2026-09-29, 9x9 evals/s 402 -> 3696 and
# train step 490 -> 149 ms. Needs a -DAZ_USE_BLAS=ON build; without one,
# pass --set backend=naive.
backend = blas

# game: board, komi (Tromp-Taylor area scoring), move cap (0 = 2 * n * n)
board_size = 9
komi = 7.5
max_moves = 0

# network (architecture keys; cannot change when resuming a run)
history = 8
blocks = 6
filters = 64
value_hidden = 64

# self-play and search: games per generation, MCTS budget, root noise, opening temperature
# The "recipe" (2026-10): games_per_generation 100 -> 200, train_steps
# 200 -> 400, temperature_moves 20 -> 7 and resignation on, adopted
# together. The 9x9-recipe arm (the sims200 control plus these four)
# beat the control 0.787 at generation 50 over 400 games (about +228
# Elo) and the 200-games/400-steps arm 0.725, and scored 0.848 against
# its start at generation 100 (docs/results/README.md). It was validated
# first by continuing from a trained 6x96 network (wide96 gen 50), then
# from scratch: 150 generations of this preset beat 9x9-main, the earlier
# preset's run with the same 6x64 network and seed, about 0.9 at equal
# generations, 0.795 at equal SGD steps (gen 125 vs 250) and 0.853 with
# gen 150 vs gen 250, 400 games each (docs/results/9x9-scratch/; one
# seed). Runs made before it used 100 / 200 / 20 / off;
# each run's config.cfg records its own values, and --resume keeps them.
# 200 games: the recipe's games average ~51 plies against ~88 played out,
# so 200 games cost about the self-play of 115 full games (1.23x the time).
# From scratch they average ~64 (~100 over the first 10 generations).
games_per_generation = 200
simulations = 200
mcts_batch = 8
c_puct = 1.5
dirichlet_scale = 10
noise_fraction = 0.25
# temperature_moves 20 -> 7: AlphaGo Zero sampled the first 30 moves of
# 361 points (~8%), which is ~7 of 81. Alone it beat the control 0.605
# at generation 50 with the same data volume (docs/results/README.md).
temperature_moves = 7
# AlphaGo Zero's random symmetry per network evaluation in search (README); off here.
# mcts_random_symmetry = false
# AlphaGo Zero's resignation in self-play (README): v_resign starts at
# resign_threshold_initial and is then calibrated so that at most
# resign_false_positive of the games played out with resignation disabled
# (resign_disabled_fraction of all) would have been resigned by their
# winner, over the last resign_window such games, once resign_min_games
# exist. On here (part of the recipe above), with the other keys at
# their defaults. It cannot be combined with ownership = true: a run with
# the ownership head needs --set resignation=false.
resignation = true
resign_threshold_initial = -0.9
resign_disabled_fraction = 0.1
resign_false_positive = 0.05
resign_window = 500
resign_min_games = 20

# training: replay window, SGD steps per generation, learning rate by generation
buffer_positions = 200000
# train_steps 200 -> 400 (the recipe): with 200 mostly resigned games
# per generation the replay ratio was 10.1 on average over the recipe's
# first 100 generations (7.7 to 13.0, docs/results/9x9-recipe/log.csv) and
# 8.4 from scratch (4.7 to 13.0, docs/results/9x9-scratch/log.csv), against
# 5.8 for the control's 100 games and 200 steps; it doubles the training
# time per generation.
train_steps = 400
batch_size = 256
# lr drop 60 -> 90: kept at 60% of the run after generations 100 -> 150.
# Replay ratio in the pilot was 6.4-7.0 (inside 2-8); longer games lower it.
lr_schedule = 0:0.02,90:0.002
momentum = 0.9
weight_decay = 0.0001

# arena: how often, games per opponent (even), opponents chosen by rating, the
# fixed bot, calibration and promotion, search budget, gating
arena_every = 1
arena_games = 20
# arena_opponents 4 -> 2, and it now counts extra references chosen by rating
# (docs/superpowers/specs/2026-10-01-rating-aware-arena-design.md). Each
# generation plays g-1, the strongest reference, and the arena_opponents
# references whose expected score is closest to 0.7. The old ladder always
# ended at generation 0, which the 9x9 reference run beat 20-0 in 110 of 150
# matches: games that carry almost no information and capped Elo near 645.
arena_opponents = 2
# Uniform-prior MCTS bots (all priors equal, value 0), e.g. "100": the same
# yardstick in every run, but a weak one. None: in the 9x9 re-rate a
# 100-simulation bot scored at most 1 of 20 against every generation from 30
# on and was not chosen after 43 (docs/results/9x9/rerate/results.csv).
# Neither list below can change on resume.
bot_simulations =
# Frozen checkpoints (comma-separated) played as fixed references; see README.
# reference_networks =
# Games each fixed player (bot or reference network) plays generation 0 when
# a run starts, and extra games a newly promoted reference plays against the
# strongest one.
calibration_games = 80
# A generation that scores at least this against the strongest reference
# joins the reference set.
promote_threshold = 0.85
arena_simulations = 100
arena_temperature_moves = 4
# The same for arena searches (arena rounds, --rerate); off here.
# arena_random_symmetry = false
gating = false
gating_threshold = 0.55

# output: self-play games saved as SGF per generation
sgf_per_generation = 2
