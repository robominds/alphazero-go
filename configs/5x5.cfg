# 5x5 preset: a small board where a full run on a laptop CPU shows a
# clearly rising Elo curve in well under an hour.
#
# This file is a preset, not a fixed contract: any key can be overridden on
# the command line with --set key=value (e.g. --set simulations=100). The
# values are tuned from pilot measurements on an Apple M4 (see
# docs/results/bench.txt and docs/results/pilots/).

# run: reproducibility seed, how long to train, threads (0 = all cores), math backend
seed = 1
# generations: 60 kept. Pilots 2026-09-29, self-play + train + arena per
# generation: 10.4 s at komi 7.5 with 10 threads; 21.3 s at komi 24.5 with
# 5 threads while a second run shared the machine. A whole run is 10-25 min.
# Elo climbs until about generation 35 and is flat after that (komi note).
generations = 60
workers = 0
# backend naive -> blas: bench 2026-09-29, 5x5 evals/s 10544 -> 30488 and
# train step 28.0 -> 12.1 ms. Needs a -DAZ_USE_BLAS=ON build; without one,
# pass --set backend=naive.
backend = blas

# game: board, komi (Tromp-Taylor area scoring), move cap (0 = 2 * n * n)
board_size = 5
# komi 7.5 -> 24.5: 5x5 is solved as a Black win by 25 (the whole board), and
# the network finds that. 60-generation pilots 2026-09-29
# (docs/results/pilots/5x5-komi*.csv):
#   komi 7.5:  self-play black_win_rate > 0.85 from generation 26 (0.90-0.96
#              over the last 10), winrate_vs_prev 0.40-0.60 from generation
#              36 on, Elo peaks at 1066 (generation 27) and sags to 733; mean
#              Elo of the last 10 generations only +124 above the first 10
#              (the 5x5 success test needs +200).
#   komi 24.5: Black wins only by owning all 25 points, so games stay
#              undecided while the network learns: black_win_rate 0.21-0.83
#              for generations 3-33, winrate_vs_prev spread 0.15-0.85, Elo
#              rises steadily to 1244 by generation 33; last-10 vs first-10
#              mean Elo +530. From ~generation 35 Black takes the whole board
#              in 90-96% of self-play games (perfect play, opening at the
#              centre), after which no komi can tell generations apart and
#              Elo drifts flat (1024 at generation 60).
#   komi 20.5: similar (+489), but black_win_rate passes 0.85 earlier
#              (generation 30) and the Elo peak is lower (1154).
# Pass --komi 24.5 to arena and analyze when using these checkpoints.
komi = 24.5
max_moves = 0

# network (architecture keys; cannot change when resuming a run)
history = 8
blocks = 3
filters = 32
value_hidden = 32

# self-play and search: games per generation, MCTS budget, root noise, opening temperature
games_per_generation = 200
simulations = 200
mcts_batch = 8
c_puct = 1.5
dirichlet_scale = 10
noise_fraction = 0.25
temperature_moves = 8

# training: replay window, SGD steps per generation, learning rate by generation
buffer_positions = 100000
train_steps = 200
batch_size = 128
lr_schedule = 0:0.02,40:0.002
momentum = 0.9
weight_decay = 0.0001

# arena: how often, how many games per opponent (even), ladder size, search budget, gating
arena_every = 1
arena_games = 20
arena_opponents = 4
arena_simulations = 100
arena_temperature_moves = 2
gating = false
gating_threshold = 0.55

# output: self-play games saved as SGF per generation
sgf_per_generation = 2
